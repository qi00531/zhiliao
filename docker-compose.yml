services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zhiliao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zhiliao-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zhiliao"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zhiliao-postgres:
